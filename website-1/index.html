<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
		table-layout: fixed;
            border: 3px solid black;
            border-collapse: collapse;
            aspect-ratio: 1;
            width: 600px;
			height: 600px;
        }
 
        td {
            border: 1px solid black;
            text-align: center;
			padding: 0;
            overflow: hidden;
        }
		
 
		td img {
		position: absolute;
		top: 0;
		left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
			object-position: center;
            display: block;
        }
 
		
		 
        .blue {
            background-color: skyblue;
        }
 
        .red {
            background-color: rgb(219, 118, 118);
        }
 
        .green {
            background-color: #26fd05;
        }
		
		.table{
		 position: absolute;
		left: 50%;
		top: 50%;
		transform: translate(-50%, -50%);
		 width: 800px;
  height: 800px;
		}
    </style>
</head>
<body>
    <table class="table">
        <tr>
            <td colspan="2" class="blue"><img src="imgs\1.jpg" style="width:531px; height:350px;">
			</td>
            <td rowspan="2" class="red">
			</td>
        </tr>
        <tr>
            <td rowspan="2" class="red">
			</td>
            <td class="green">
			</td>
        </tr>
        <tr>
            <td colspan="2" class="blue">
			</td>
        </tr>
    </table>
</body>
</html>
